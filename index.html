<!DOCTYPE html>
<html>
<head>
    <title>Shaders</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"></script>
    <style>body { margin: 0; overflow: hidden; } canvas { display: block; width : 100vw; height: 100vh;}</style>
    <link rel = "stylesheet" href = "WebGL.css">
</head>
<body>

         <img src = "images/pointerleft.png"  onclick="PrevShader()" id = "leftarrow">

      <div class = "leftPanel">

        <div class = "knobContainer">
          <img src = "images/knob.png" class = "knob" onmousedown="ChangeSliderValue(event, this)" id = "delayWet">
        </div>

          <canvas id = "feedback" class = "spriteSlider" onmousedown="ChangeSliderValue(event, this)"></canvas>

         <div class = "knobContainer">
          <img src = "images/knob.png" class = "knob" onmousedown="ChangeSliderValue(event, this)" id = "delayTime">
        </div>

        <canvas id = "bitcrush" class = "spriteSlider" onmousedown="ChangeSliderValue(event, this)"></canvas>

      </div>

      <div class = "rightPanel">

        <div class = "visualContainer">
        <div class = "visual">
          <img src = "images/brainScopeFore.png" id = "brainScopeFore">
          <canvas id = "oscillator"></canvas>
          <img src = "images/brainScopeBack.png" id = "brainScopeBack">
        </div>
        </div>

        <div class = "sliderBody">
          <img src = "images/slider.png" class = "sliderBackground">
          <img src = "images/slidervalue.png" class = "sliderValue">
          <img src = "images/sliderdial.png" class = "sliderDial" onmousedown="ChangeSliderValue(event, this)" id = "filter">
        </div>

        <div class = "sliderBody">
          <img src = "images/slider.png" class = "sliderBackground">
          <img src = "images/slidervalue.png" class = "sliderValue">
          <img src = "images/sliderdial.png" class = "sliderDial" onmousedown="ChangeSliderValue(event, this)" id = "q">
        </div>

              <div class = "adsr">

        <img src = "images/crosshairs_0008_brain.png" class = "adsrHandle" id = "base">

        <img src = "images/crosshairs_0008_brain.png" class = "adsrHandle"  onmousedown = "ChangeSliderValue(event,this)" id = "attack">

        
        <img src = "images/crosshairs_0008_brain.png" class = "adsrHandle"  onmousedown = "ChangeSliderValue(event,this)" id = "release">
        
        <img src = "images/crosshairs_0008_brain.png" class = "adsrHandle"  onmousedown = "ChangeSliderValue(event,this)" id = "decay">


        <canvas id = "adsrCanvas"></canvas>

      </div>
        
      </div>

    <div class = "bottomPanel">
        <div class = "sliderBody">
          <img src = "images/slider.png" class = "sliderBackground">
          <img src = "images/slidervalue.png" class = "sliderValue">
          <img src = "images/sliderdial.png" class = "sliderDial" onmousedown="ChangeSliderValue(event, this)" id = "fbm">
        </div>

           <div class = "waveformList">
        <div class = "waveContainer"  id = "sine" onclick="ChangeCarrierWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/sine.png" class = "wave">
        </div>
        
        <div class = "waveContainer"  id = "triangle" onclick="ChangeCarrierWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/triangle.png" class = "wave">
        </div>

          <div class = "waveContainer"  id = "sawtooth" onclick="ChangeCarrierWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/saw.png" class = "wave">
        </div>

        <div class = "waveContainer"  id = "square" onclick="ChangeCarrierWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/square.png" class = "wave">
        </div>

        <div class = "waveContainer"  id = "modSine" onclick="ChangeModWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/sine.png" class = "modWave">
        </div>
        
        <div class = "waveContainer"  id = "modTriangle" onclick="ChangeModWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/triangle.png" class = "modWave">
        </div>

          <div class = "waveContainer"  id = "modSawtooth" onclick="ChangeModWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/saw.png" class = "modWave">
        </div>

        <div class = "waveContainer"  id = "modSquare" onclick="ChangeModWaveform(this)">
          <img src = "images/click.png" id = "selected">
          <img src = "images/square.png" class = "modWave">
        </div>

      </div>

        <div class = "sliderBody">
          <img src = "images/slider.png" class = "sliderBackground">
          <img src = "images/slidervalue.png" class = "sliderValue">
          <img src = "images/sliderdial.png" class = "sliderDial" onmousedown="ChangeSliderValue(event, this)" id = "hurst">
        </div>
    </div> 

      <!-- <div>
          <img src = "images/brainborderWithBackground.png" class = "waveformBG">
      </div> -->

    <!-- <div class = "panel">
      <img src = "images/panels.png">
    </div> -->


    <canvas id="canvas"></canvas>


    <script src = "WebGLScripting.js"></script>
